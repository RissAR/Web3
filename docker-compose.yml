version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lead_hub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lead_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-lead_hub_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lead_admin} -d ${POSTGRES_DB:-lead_hub_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lead_network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: lead_hub_n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      - GENERIC_TIMEZONE=${TIMEZONE:-Europe/Kyiv}
      - TZ=${TIMEZONE:-Europe/Kyiv}
      # Налаштування виконання для високої стабільності
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "${N8N_PORT_BIND:-5678}:5678"
    networks:
      - lead_network

networks:
  lead_network:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
